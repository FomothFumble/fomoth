<rect x="40" y="26" width="960" height="150" rx="14" fill="#0b0e08" stroke="rgba(20,241,149,0.22)"/>
<text x="72" y="62" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8BFFCB">THE COACH · A WORKED PLAY FROM YOUR OWN TRADES</text>
<text x="72" y="102" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#F1F3FA"><tspan fill="#14F195" font-weight="700">$GOAT</tspan>  you sold 1,906 tokens at <tspan font-weight="700">$0.19</tspan> for <tspan font-weight="700">$358</tspan>.</text>
<text x="72" y="132" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#8A93B0">it topped <tspan fill="#9945FF" font-weight="700">$15.44</tspan>, an 82x. that exit handed back <tspan fill="#F1F3FA" font-weight="700">$29,070</tspan>.</text>
<text x="72" y="162" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#F1F3FA">a 40% trailing stop off the peak would have kept <tspan fill="#14F195" font-weight="800">$17,657</tspan> of it.</text>
