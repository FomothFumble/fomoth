<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<rect width="1200" height="300" fill="#060806"/>
<text x="40" y="52" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#8BFFCB">PIPELINE</text>
<rect x="40" y="96" width="150" height="108" rx="12" fill="#0b0e08" stroke="rgba(20,241,149,0.28)" stroke-width="1"/>
<text x="115.0" y="126" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">wallet</text>
<text x="115.0" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">a Solana</text>
<text x="115.0" y="166" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">address</text>
<rect x="250" y="96" width="180" height="108" rx="12" fill="#0b0e08" stroke="rgba(20,241,149,0.28)" stroke-width="1"/>
<text x="340.0" y="126" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Python</text>
<text x="340.0" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">Solana Tracker,</text>
<text x="340.0" y="166" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">prices, trades</text>
<rect x="470" y="96" width="190" height="108" rx="12" fill="#0b0e08" stroke="#14F195" stroke-width="2"/>
<text x="565.0" y="126" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#14F195">C++ core</text>
<text x="565.0" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">regret engine:</text>
<text x="565.0" y="166" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">suffix-max +</text>
<text x="565.0" y="184" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">binary search</text>
<rect x="700" y="96" width="150" height="108" rx="12" fill="#0b0e08" stroke="rgba(20,241,149,0.28)" stroke-width="1"/>
<text x="775.0" y="126" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Python</text>
<text x="775.0" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">report</text>
<text x="775.0" y="166" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">+ coach</text>
<rect x="915" y="96" width="165" height="108" rx="12" fill="#0b0e08" stroke="rgba(20,241,149,0.28)" stroke-width="1"/>
<text x="997.5" y="126" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">web demo</text>
<text x="997.5" y="148" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">the fumble,</text>
<text x="997.5" y="166" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A93B0">rendered</text>
<line x1="190" y1="150.0" x2="241" y2="150.0" stroke="#14F195" stroke-width="2" opacity="0.8"/><path d="M241,145.0 L250,150.0 L241,155.0 Z" fill="#14F195"/>
<line x1="430" y1="150.0" x2="461" y2="150.0" stroke="#14F195" stroke-width="2" opacity="0.8"/><path d="M461,145.0 L470,150.0 L461,155.0 Z" fill="#14F195"/>
<line x1="660" y1="150.0" x2="691" y2="150.0" stroke="#14F195" stroke-width="2" opacity="0.8"/><path d="M691,145.0 L700,150.0 L691,155.0 Z" fill="#14F195"/>
<line x1="850" y1="150.0" x2="906" y2="150.0" stroke="#14F195" stroke-width="2" opacity="0.8"/><path d="M906,145.0 L915,150.0 L906,155.0 Z" fill="#14F195"/>
<text x="40" y="250" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A93B0">fumble = tokens_sold &#215; max(0, peak_high_after_sell &#8722; price_at_sell), summed over every sell</text>
<text x="40" y="274" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#4B5170">the C++ core does the heavy pass; Python falls back to a pure implementation when it is not built</text>
</svg>